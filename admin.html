<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Shri Beatz</title>
<link rel="manifest" href="admin-manifest.json">
<link rel="icon" href="admin-logo.png">
<link rel="apple-touch-icon" href="admin-logo.png">
<meta name="theme-color" content="#0a0a0a">
<style>
  :root{
    --bg:#0a0a0a;--bg2:#0f0f0f;--card:#161616;--card2:#1b1b1b;--orange:#ff8c1a;--orange-dim:#ffa63d;
    --text:#f2f2f2;--muted:#8f8f8f;--border:#252525;--green:#3ecf8e;--red:#ff5c5c;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at top, #121212 0%, #0a0a0a 60%);
    color:var(--text);
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    padding-bottom:50px;
    min-height:100vh;
  }
  .container{max-width:680px;margin:0 auto;padding:20px 16px;}
  .top-bar{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:28px;padding-bottom:16px;border-bottom:1px solid var(--border);
  }
  .top-bar h1{margin:0;font-size:22px;letter-spacing:0.3px;}
  .top-bar h1 span{color:var(--orange);}
  .top-bar button{
    width:auto;padding:9px 18px;font-size:12px;background:#1c1c1c;color:var(--muted);
    border:1px solid var(--border);border-radius:8px;font-weight:600;
  }
  .top-bar button:hover{color:var(--text);border-color:#444;}

  h2{
    font-size:13px;margin:30px 0 14px;color:var(--muted);
    text-transform:uppercase;letter-spacing:1.2px;font-weight:700;
    display:flex;align-items:center;gap:8px;
  }
  h2::after{content:'';flex:1;height:1px;background:var(--border);}
  .collapsible-header{
    display:flex;align-items:center;gap:10px;cursor:pointer;
    margin:30px 0 0;
  }
  .collapsible-header .chevron{font-size:16px;color:var(--muted);}
  #addBeatPanel{margin-top:14px;}

  .card{
    background:linear-gradient(180deg, var(--card2) 0%, var(--card) 100%);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:12px;
    box-shadow:0 4px 18px rgba(0,0,0,0.3);
  }

  .field{margin-bottom:10px;}
  .field label{
    font-size:11px;color:var(--muted);display:block;margin-bottom:5px;
    text-transform:uppercase;letter-spacing:0.6px;font-weight:600;
  }
  .field input{
    width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);
    background:#0d0d0d;color:var(--text);font-size:14px;transition:border-color 0.15s;
  }
  .field input:focus{outline:none;border-color:var(--orange);}
  .field input::placeholder{color:#5a5a5a;}

  button{
    background:linear-gradient(135deg, var(--orange-dim), var(--orange));
    color:#0a0a0a;border:none;padding:11px 18px;border-radius:9px;
    font-weight:700;font-size:13px;cursor:pointer;width:100%;
    box-shadow:0 3px 12px rgba(255,140,26,0.25);
    transition:transform 0.1s;
  }
  button:active{transform:scale(0.98);}
  button.secondary{background:#1c1c1c;color:var(--muted);box-shadow:none;border:1px solid var(--border);}

  .order-row-main{border-bottom:1px solid var(--border);}
  .order-row-main:last-child{border-bottom:none;}
  .order-summary-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 2px;cursor:pointer;
  }
  .order-summary-name{font-size:14px;font-weight:600;margin-bottom:2px;}
  .order-summary-meta{font-size:11.5px;color:var(--muted);}
  .order-summary-right{display:flex;align-items:center;gap:10px;}
  .order-summary-price{font-size:15px;font-weight:700;color:var(--orange);}
  .order-detail-panel{padding:0 4px 16px;}
  .detail-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:6px 0;border-bottom:1px solid #1c1c1c;font-size:12.5px;
  }
  .detail-row:last-of-type{border-bottom:none;}
  .detail-label{color:var(--muted);}
  .detail-value{color:var(--text);font-weight:600;text-align:right;}
  .detail-value.mono{font-family:monospace;font-size:11px;}
  .whatsapp-buyer-btn{
    display:block;text-align:center;margin-top:12px;padding:10px;
    border-radius:10px;background:#1c2b1c;border:1px solid #2a4a2a;
    color:#7ee787;text-decoration:none;font-size:12.5px;font-weight:700;
  }
  .fy-btn-row{display:flex;gap:8px;flex-wrap:wrap;}
  .fy-btn{
    width:auto;padding:8px 14px;font-size:12px;font-weight:600;
    background:#1c1c1c;color:var(--text);border:1px solid var(--border);
    box-shadow:none;
  }
  .fy-btn.active{background:linear-gradient(135deg, var(--orange-dim), var(--orange));color:#0a0a0a;}

  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .stat-card{
    background:linear-gradient(150deg, #181818, #121212);
    border:1px solid var(--border);border-radius:14px;padding:14px 12px;text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
  .stat-card .num{font-size:26px;font-weight:800;color:var(--orange);letter-spacing:0.5px;}
  .stat-card .label{font-size:10.5px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:0.8px;font-weight:600;}

  .beat-row-main{border-bottom:1px solid var(--border);}
  .beat-row-main:last-child{border-bottom:none;}
  .beat-summary{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 2px;cursor:pointer;
  }
  .beat-summary-name{font-size:14px;font-weight:600;margin-bottom:2px;}
  .beat-summary-meta{font-size:11.5px;color:var(--muted);}
  .chevron{font-size:16px;color:var(--muted);transition:transform 0.15s;}
  .beat-edit-panel{padding:0 2px 10px;}
  .beat-edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
  .beat-edit-grid .full{grid-column:1 / -1;}
  .beat-edit-grid label{font-size:10px;color:var(--muted);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:0.5px;}
  .beat-edit-grid input{
    width:100%;padding:8px 9px;border-radius:8px;border:1px solid var(--border);
    background:#0d0d0d;color:var(--text);font-size:13px;
  }
  .beat-row-actions{display:flex;gap:8px;}
  .beat-row-actions button{width:auto;padding:8px 14px;font-size:11.5px;box-shadow:none;flex:1;}
  .edit-btn{background:#16283a !important;color:#5bc0ff !important;border:1px solid #1f3a52;}
  .del-btn{background:#2e1414 !important;color:var(--red) !important;border:1px solid #442020;}
  .link-btn{background:#1a2e1a !important;color:var(--green) !important;border:1px solid #24401f;}
  .move-btns{display:flex;flex-direction:column;gap:2px;margin-right:6px;}
  .move-btns button{
    width:26px;height:22px;padding:0;font-size:11px;line-height:1;
    background:#1c1c1c !important;color:var(--muted) !important;
    border:1px solid var(--border);box-shadow:none;border-radius:6px;
  }
  .move-btns button:disabled{opacity:0.25;}
  .beat-summary{display:flex;align-items:center;gap:0;}
  .beat-summary-clickable{display:flex;justify-content:space-between;align-items:center;flex:1;cursor:pointer;padding:9px 2px;}

  #loginBox{max-width:360px;margin:100px auto 0;text-align:center;}
  #loginBox h1{font-size:24px;margin-bottom:6px;}
  #loginBox h1 span{color:var(--orange);}
  #loginBox .sub{color:var(--muted);font-size:12.5px;margin-bottom:24px;}
  .msg{font-size:12px;color:var(--muted);margin-top:10px;text-align:center;}
</style>
</head>
<body>

<div class="container">
  <div id="loginBox" class="card">
    <h1>Shri <span>Beatz</span></h1>
    <div class="sub">Admin Dashboard</div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="admin email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="password">
    </div>
    <button onclick="doLogin()">Login</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="adminPanel" style="display:none">
    <div class="top-bar">
      <div style="display:flex;align-items:center;gap:10px;">
        <img src="admin-logo.png" alt="Logo" style="width:32px;height:32px;border-radius:8px;object-fit:cover;">
        <h1>Admin <span>Panel</span></h1>
      </div>
      <button class="secondary" onclick="doLogout()">Logout</button>
    </div>

    <h2>📊 Overview</h2>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="num" id="statOrders">0</div>
        <div class="label">Total Orders</div>
        <div id="statOrdersPending" style="font-size:11px;color:#ffb44d;font-weight:700;margin-top:2px;display:none"></div>
      </div>
      <div class="stat-card">
        <div class="num" id="statEarnings">₹0</div>
        <div class="label">Total Earnings</div>
      </div>
      <div class="stat-card">
        <div class="num" id="statBeats">0</div>
        <div class="label">Beats Listed</div>
      </div>
      <div class="stat-card">
        <div class="num" id="statPlays">0</div>
        <div class="label">Total Plays</div>
      </div>
    </div>

    <button class="secondary" onclick="toggleReport()" style="margin-bottom:12px;">📊 View Sales Report</button>
    <div class="card" id="reportPanel" style="display:none">
      <div class="field">
        <label>Quick Select (Financial Year, Apr–Mar)</label>
        <div class="fy-btn-row" id="fyBtnRow"></div>
      </div>
      <div class="beat-edit-grid">
        <div class="full">
          <label>Or Custom Range</label>
        </div>
        <div>
          <label>From</label>
          <input type="date" id="reportFrom">
        </div>
        <div>
          <label>To</label>
          <input type="date" id="reportTo">
        </div>
      </div>
      <button onclick="generateReport()">Generate Report</button>
      <div id="reportResults" style="display:none;margin-top:14px;">
        <div class="detail-row"><span class="detail-label">Period</span><span class="detail-value" id="repPeriod"></span></div>
        <div class="detail-row"><span class="detail-label">Orders</span><span class="detail-value" id="repOrders"></span></div>
        <div class="detail-row"><span class="detail-label">Gross Sales</span><span class="detail-value" id="repGross"></span></div>
        <div class="detail-row"><span class="detail-label">Razorpay Fees (2.36%)</span><span class="detail-value" id="repFees"></span></div>
        <div class="detail-row"><span class="detail-label" style="color:var(--green);font-weight:700;">Net Earnings</span><span class="detail-value" id="repNet" style="color:var(--green);font-size:15px;"></span></div>
        <button class="secondary" style="margin-top:12px;" onclick="downloadReportCSV()">⬇️ Download as CSV</button>
      </div>
    </div>


    <div class="collapsible-header" onclick="toggleOrders()">
      <h2 style="margin:0;border:none;flex:1;">📦 Orders</h2>
      <span class="chevron" id="ordersChevron">⌄</span>
    </div>
    <div class="card" id="ordersList" style="display:none">
      <div class="msg">Loading...</div>
    </div>

    <div class="collapsible-header" onclick="toggleAddBeat()">
      <h2 style="margin:0;border:none;flex:1;">➕ Add New Beat</h2>
      <span class="chevron" id="addBeatChevron">⌄</span>
    </div>
    <div class="card" id="addBeatPanel" style="display:none">
      <div class="field">
        <label>Beat Name (as on YouTube)</label>
        <input type="text" id="beatName" placeholder='e.g. "ACHANAK" - Indian Gangsta Type Beat'>
      </div>
      <div class="field">
        <label>Genre / Style</label>
        <input type="text" id="beatGenre" placeholder="Oldschool / 90s Type Beat">
      </div>
      <div class="field">
        <label>Key (optional)</label>
        <input type="text" id="beatKey" placeholder="e.g. C Minor">
      </div>
      <div class="field">
        <label>BPM (optional)</label>
        <input type="number" id="beatBpm" placeholder="e.g. 140">
      </div>
      <div class="field">
        <label>Price (₹)</label>
        <input type="number" id="beatPrice" placeholder="50">
      </div>
      <div class="field">
        <label>Preview Audio Filename (upload mp3 to /beats/ folder on GitHub first, then type exact filename here)</label>
        <input type="text" id="beatFile" placeholder="e.g. mybeat.mp3">
      </div>
      <div class="field">
        <label>Cover Image Filename (upload image to /covers/ folder on GitHub first, then type exact filename here)</label>
        <input type="text" id="beatCover" placeholder="e.g. mycover.jpg">
      </div>
      <button onclick="addBeat()">Add Beat</button>
      <div class="msg" id="addMsg"></div>
    </div>

    <div class="collapsible-header" onclick="toggleManageBeats()">
      <h2 style="margin:0;border:none;flex:1;">🎵 Manage Beats</h2>
      <span class="chevron" id="manageBeatsChevron">⌄</span>
    </div>
    <div id="manageBeatsPanel" style="display:none">
      <div class="field">
        <input type="text" id="adminSearch" placeholder="🔍 Search beats...">
      </div>
      <div class="card" id="beatsList">
        <div class="msg">Loading...</div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getDatabase, ref, onValue, push, set, remove, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAZOYSy3s3HwkjhnwQzWPMzabky9LrjX8c",
    authDomain: "shri-beatz-store.firebaseapp.com",
    databaseURL: "https://shri-beatz-store-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "shri-beatz-store",
    storageBucket: "shri-beatz-store.firebasestorage.app",
    messagingSenderId: "1016496280094",
    appId: "1:1016496280094:web:c4398a985f875d0dc7940f"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  window.doLogin = function(){
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    document.getElementById('loginMsg').textContent = 'Logging in...';
    signInWithEmailAndPassword(auth, email, password)
      .catch(err=>{
        document.getElementById('loginMsg').textContent = 'Login failed: ' + err.message;
      });
  }

  window.doLogout = function(){
    signOut(auth);
  }

  onAuthStateChanged(auth, (user)=>{
    if(user){
      document.getElementById('loginBox').style.display='none';
      document.getElementById('adminPanel').style.display='block';
      loadBeats();
      loadOrders();
    } else {
      document.getElementById('loginBox').style.display='block';
      document.getElementById('adminPanel').style.display='none';
    }
  });

  window.addBeat = function(){
    const name = document.getElementById('beatName').value.trim();
    const genre = document.getElementById('beatGenre').value.trim();
    const key = document.getElementById('beatKey').value.trim();
    const bpmVal = document.getElementById('beatBpm').value.trim();
    const bpm = bpmVal ? parseInt(bpmVal) : null;
    const price = parseInt(document.getElementById('beatPrice').value);
    const file = document.getElementById('beatFile').value.trim();
    const cover = document.getElementById('beatCover').value.trim();
    if(!name || !price || !file){
      document.getElementById('addMsg').textContent = 'Please fill Name, Price and File Name.';
      return;
    }
    const beatRef = push(ref(db, 'beats'));
    const beatData = {
      name, genre, key, price, file, cover,
      plays: 0,
      order: window.__nextOrder != null ? window.__nextOrder : Date.now(),
      createdAt: Date.now()
    };
    if(bpm) beatData.bpm = bpm;
    set(beatRef, beatData).then(()=>{
      document.getElementById('addMsg').textContent = '✅ Beat added!';
      document.getElementById('beatName').value='';
      document.getElementById('beatGenre').value='';
      document.getElementById('beatKey').value='';
      document.getElementById('beatBpm').value='';
      document.getElementById('beatPrice').value='';
      document.getElementById('beatFile').value='';
      document.getElementById('beatCover').value='';
    });
  }

  function loadBeats(){
    onValue(ref(db, 'beats'), (snapshot)=>{
      const data = snapshot.val();
      const list = document.getElementById('beatsList');
      list.innerHTML='';
      if(!data){
        list.innerHTML = '<div class="msg">No beats yet.</div>';
        document.getElementById('statBeats').textContent = '0';
        document.getElementById('statPlays').textContent = '0';
        return;
      }
      let totalPlays = 0;
      const sortedEntries = Object.entries(data).sort((a,b)=>{
        const oa = a[1].order, ob = b[1].order;
        const aHas = typeof oa === 'number', bHas = typeof ob === 'number';
        if(aHas && bHas) return oa - ob;
        if(aHas && !bHas) return -1;
        if(!aHas && bHas) return 1;
        return (a[1].createdAt||0)-(b[1].createdAt||0);
      });
      window.__sortedBeatIds = sortedEntries.map(e=>e[0]);
      const maxOrder = sortedEntries.reduce((m,[,b])=> typeof b.order==='number' ? Math.max(m,b.order) : m, -1);
      window.__nextOrder = maxOrder + 1;
      sortedEntries.forEach(([id, beat])=>{
        totalPlays += (beat.plays||0);
        const row = document.createElement('div');
        row.className='beat-row-main';
        row.dataset.search = `${beat.name||''} ${beat.genre||''} ${beat.key||''}`.toLowerCase();
        row.innerHTML = `
          <div class="beat-summary">
            <div class="move-btns">
              <button onclick="event.stopPropagation();moveBeat('${id}','up')" title="Move up">▲</button>
              <button onclick="event.stopPropagation();moveBeat('${id}','down')" title="Move down">▼</button>
            </div>
            <div class="beat-summary-clickable" onclick="toggleBeatRow('${id}')">
              <div class="beat-summary-info">
                <div class="beat-summary-name">${beat.name||'Untitled'} ${beat.isPrivate ? '<span style="background:#2a1414;color:#ff6b6b;border:1px solid #4a2020;font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:6px;">🔒 PRIVATE</span>' : ''}</div>
                <div class="beat-summary-meta">₹${beat.price||0} · 🎧 ${beat.plays||0} plays${beat.genre ? ' · '+beat.genre : ''}</div>
              </div>
              <span class="chevron" id="chevron-${id}">⌄</span>
            </div>
          </div>
          <div class="beat-edit-panel" id="panel-${id}" style="display:none">
            <div class="beat-edit-grid">
              <div class="full">
                <label>Beat Name</label>
                <input type="text" id="name-${id}" value="${beat.name||''}">
              </div>
              <div>
                <label>Genre</label>
                <input type="text" id="genre-${id}" value="${beat.genre||''}">
              </div>
              <div>
                <label>Key</label>
                <input type="text" id="key-${id}" value="${beat.key||''}">
              </div>
              <div>
                <label>BPM</label>
                <input type="number" id="bpm-${id}" value="${beat.bpm||''}">
              </div>
              <div>
                <label>Cover File</label>
                <input type="text" id="cover-${id}" value="${beat.cover||''}">
              </div>
              <div>
                <label>Price (₹)</label>
                <input type="number" id="price-${id}" value="${beat.price||''}">
              </div>
            </div>
            <div class="beat-row-actions">
              <button class="link-btn" onclick='copyBeatLink("${id}", ${JSON.stringify(beat.name||"")})'>🔗 Copy Link</button>
              <button class="edit-btn" onclick="updateBeat('${id}')">Save Changes</button>
              <button class="del-btn" onclick='deleteBeat("${id}", ${JSON.stringify(beat.name||"this beat")})'>Delete</button>
            </div>
            <div class="beat-row-actions" style="margin-top:8px">
              <button onclick="toggleBeatPrivate('${id}', ${beat.isPrivate ? 'false' : 'true'})" style="width:100%;background:${beat.isPrivate ? 'linear-gradient(135deg,#3dd68c,#1eae66)' : 'linear-gradient(135deg,#ff8c6b,#e2543a)'};color:#000;border:none;font-weight:700;">${beat.isPrivate ? '🔓 Make Public' : '🔒 Make Private'}</button>
            </div>
          </div>
        `;
        list.appendChild(row);
      });
      document.getElementById('statBeats').textContent = Object.keys(data).length;
      document.getElementById('statPlays').textContent = totalPlays;
      applyAdminSearch();
    });
  }

  function applyAdminSearch(){
    const term = document.getElementById('adminSearch').value.trim().toLowerCase();
    document.querySelectorAll('#beatsList .beat-row-main').forEach(row=>{
      row.style.display = (!term || row.dataset.search.includes(term)) ? '' : 'none';
    });
  }
  document.getElementById('adminSearch').addEventListener('input', applyAdminSearch);

  window.updateBeat = function(id){
    const name = document.getElementById('name-'+id).value.trim();
    const genre = document.getElementById('genre-'+id).value.trim();
    const key = document.getElementById('key-'+id).value.trim();
    const bpmVal = document.getElementById('bpm-'+id).value.trim();
    const cover = document.getElementById('cover-'+id).value.trim();
    const priceVal = document.getElementById('price-'+id).value;
    const updates = {};
    if(name) updates.name = name;
    if(genre) updates.genre = genre;
    if(key) updates.key = key;
    if(bpmVal) updates.bpm = parseInt(bpmVal);
    if(cover) updates.cover = cover;
    if(priceVal && parseInt(priceVal) > 0) updates.price = parseInt(priceVal);
    if(Object.keys(updates).length === 0){
      alert('Nothing to update.');
      return;
    }
    update(ref(db, 'beats/'+id), updates).then(()=>{
      alert('✅ Updated!');
    });
  }

  window.toggleOrders = function(){
    const panel = document.getElementById('ordersList');
    const chevron = document.getElementById('ordersChevron');
    const isOpen = panel.style.display !== 'none';
    panel.style.display = isOpen ? 'none' : 'block';
    chevron.textContent = isOpen ? '⌄' : '⌃';
  }

  window.toggleReport = function(){
    const panel = document.getElementById('reportPanel');
    const chevron = document.getElementById('reportChevron');
    const isOpen = panel.style.display !== 'none';
    panel.style.display = isOpen ? 'none' : 'block';
    chevron.textContent = isOpen ? '⌄' : '⌃';
  }

  // Build financial year quick-select buttons (India: Apr 1 – Mar 31)
  const RAZORPAY_FEE_RATE = 0.0236; // 2% + 18% GST on that fee ≈ 2.36%
  let __lastReport = null;

  const BUSINESS_START_FY_YEAR = 2026; // FY 2026-27 — the business's first financial year

  function buildFyButtons(){
    const row = document.getElementById('fyBtnRow');
    const now = new Date();
    const currentCalYear = now.getFullYear();
    // If we're before April, the current FY started last calendar year
    const currentFyStartYear = now.getMonth() >= 3 ? currentCalYear : currentCalYear - 1;
    // Show every FY from the business's first year up through the current one.
    // Since currentFyStartYear is always computed from today's date, this list
    // grows by itself every April — no manual updates needed in future years.
    const years = [];
    for(let y = currentFyStartYear; y >= BUSINESS_START_FY_YEAR; y--){
      years.push(y);
    }
    row.innerHTML = '';
    years.forEach(startYear=>{
      const label = `${startYear}-${String(startYear+1).slice(-2)}`;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'fy-btn';
      btn.textContent = label;
      btn.onclick = ()=> runFyReport(startYear, btn);
      row.appendChild(btn);
    });
  }

  function runFyReport(startYear, btnEl){
    document.querySelectorAll('.fy-btn').forEach(b=>b.classList.remove('active'));
    if(btnEl) btnEl.classList.add('active');
    const from = new Date(startYear, 3, 1); // April 1
    const to = new Date(startYear+1, 2, 31, 23, 59, 59); // March 31 next year
    document.getElementById('reportFrom').value = from.toISOString().slice(0,10);
    document.getElementById('reportTo').value = to.toISOString().slice(0,10);
    computeAndShowReport(from.getTime(), to.getTime(), `FY ${startYear}-${String(startYear+1).slice(-2)}`);
  }

  window.generateReport = function(){
    document.querySelectorAll('.fy-btn').forEach(b=>b.classList.remove('active'));
    const fromVal = document.getElementById('reportFrom').value;
    const toVal = document.getElementById('reportTo').value;
    if(!fromVal || !toVal){
      alert('Please select both From and To dates, or pick a financial year above.');
      return;
    }
    const from = new Date(fromVal + 'T00:00:00').getTime();
    const to = new Date(toVal + 'T23:59:59').getTime();
    const label = `${fromVal} → ${toVal}`;
    computeAndShowReport(from, to, label);
  }

  function computeAndShowReport(fromTs, toTs, label){
    const allOrders = window.__allOrders || {};
    const inRange = Object.values(allOrders).filter(o => o.createdAt >= fromTs && o.createdAt <= toTs);
    const gross = inRange.reduce((sum, o) => sum + (o.price||0), 0);
    const fees = Math.round(gross * RAZORPAY_FEE_RATE * 100) / 100;
    const net = Math.round((gross - fees) * 100) / 100;
    __lastReport = { label, count: inRange.length, gross, fees, net, orders: inRange };

    document.getElementById('repPeriod').textContent = label;
    document.getElementById('repOrders').textContent = inRange.length;
    document.getElementById('repGross').textContent = '₹' + gross.toFixed(2);
    document.getElementById('repFees').textContent = '−₹' + fees.toFixed(2);
    document.getElementById('repNet').textContent = '₹' + net.toFixed(2);
    document.getElementById('reportResults').style.display = 'block';
  }

  window.downloadReportCSV = function(){
    if(!__lastReport) return;
    let csv = 'Beat Name,Buyer,Amount,Razorpay Fee (2.36%),Net,Payment ID,Date\n';
    __lastReport.orders.forEach(o=>{
      const fee = (o.price * RAZORPAY_FEE_RATE).toFixed(2);
      const net = (o.price - fee).toFixed(2);
      const date = new Date(o.createdAt).toLocaleDateString('en-IN');
      csv += `"${o.beatName}","${o.buyerName}",${o.price},${fee},${net},"${o.paymentId}","${date}"\n`;
    });
    csv += `\nTOTAL,,${__lastReport.gross.toFixed(2)},${__lastReport.fees.toFixed(2)},${__lastReport.net.toFixed(2)},,\n`;
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `shribeatz-sales-${__lastReport.label.replace(/[^a-z0-9]/gi,'-')}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  buildFyButtons();

  window.toggleManageBeats = function(){
    const panel = document.getElementById('manageBeatsPanel');
    const chevron = document.getElementById('manageBeatsChevron');
    const isOpen = panel.style.display !== 'none';
    panel.style.display = isOpen ? 'none' : 'block';
    chevron.textContent = isOpen ? '⌄' : '⌃';
  }

  window.toggleAddBeat = function(){
    const panel = document.getElementById('addBeatPanel');
    const chevron = document.getElementById('addBeatChevron');
    const isOpen = panel.style.display !== 'none';
    panel.style.display = isOpen ? 'none' : 'block';
    chevron.textContent = isOpen ? '⌄' : '⌃';
  }

  window.toggleOrderRow = function(id){
    const panel = document.getElementById('order-panel-'+id);
    const chevron = document.getElementById('order-chevron-'+id);
    const isOpen = panel.style.display !== 'none';
    panel.style.display = isOpen ? 'none' : 'block';
    chevron.textContent = isOpen ? '⌄' : '⌃';
  }

  window.toggleBeatRow = function(id){
    const panel = document.getElementById('panel-'+id);
    const chevron = document.getElementById('chevron-'+id);
    const isOpen = panel.style.display !== 'none';
    panel.style.display = isOpen ? 'none' : 'block';
    chevron.textContent = isOpen ? '⌄' : '⌃';
  }

  const SITE_BASE_URL = "https://officialshribeatz.github.io/shri-beatz-store/";

  function slugify(str){
    return (str||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  }

  function fallbackCopy(text){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch(e){ ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  window.copyBeatLink = function(id, name){
    const slug = slugify(name);
    const link = SITE_BASE_URL + '?beat=' + slug;
    const ok = fallbackCopy(link);
    if(ok){
      alert('✅ Link copied! You can now paste it directly.\n\n' + link);
    } else {
      prompt('Copy this link manually (tap, select all, copy):', link);
    }
  }

  window.moveBeat = function(id, direction){
    const ids = window.__sortedBeatIds || [];
    const idx = ids.indexOf(id);
    if(idx === -1) return;
    const swapIdx = direction === 'up' ? idx - 1 : idx + 1;
    if(swapIdx < 0 || swapIdx >= ids.length) return;
    const otherId = ids[swapIdx];
    // Assign fresh sequential order values to the whole list based on new arrangement
    const newIds = [...ids];
    [newIds[idx], newIds[swapIdx]] = [newIds[swapIdx], newIds[idx]];
    const updates = {};
    newIds.forEach((bid, i)=>{
      updates['beats/'+bid+'/order'] = i;
    });
    update(ref(db), updates);
  }

  window.deleteBeat = function(id, name){
    if(confirm(`Delete "${name}"?\n\nThis cannot be undone.`)){
      remove(ref(db, 'beats/'+id));
    }
  }

  function loadOrders(){
    onValue(ref(db, 'orders'), (snapshot)=>{
      const data = snapshot.val();
      window.__allOrders = data || {};
      const list = document.getElementById('ordersList');
      list.innerHTML='';
      if(!data){
        list.innerHTML = '<div class="msg">No orders yet.</div>';
        document.getElementById('statOrders').textContent = '0';
        document.getElementById('statEarnings').textContent = '₹0';
        return;
      }
      const orders = Object.entries(data).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
      let totalEarnings = 0;
      let pendingCount = 0;
      orders.forEach(([id, o])=>{
        const isPaid = o.status === 'paid';
        const isAwaiting = o.status === 'awaiting_confirmation';
        if(isPaid) totalEarnings += (o.price||0);
        else pendingCount++;
        const div = document.createElement('div');
        div.className='order-row-main';
        if(isAwaiting){ div.style.border = '1.5px solid #ffd23d'; div.style.borderRadius = '14px'; }
        else if(!isPaid){ div.style.border = '1.5px solid #ff8c1a'; div.style.borderRadius = '14px'; }
        const date = new Date(o.createdAt).toLocaleString('en-IN', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
        const statusBadge = isPaid
          ? `<span style="background:#1c2b1c;color:#7ee787;border:1px solid #2a4a2a;font-size:10px;font-weight:700;padding:3px 9px;border-radius:12px;">✅ PAID</span>`
          : isAwaiting
          ? `<span style="background:#2b2a0f;color:#ffe066;border:1px solid #4a481a;font-size:10px;font-weight:700;padding:3px 9px;border-radius:12px;">👀 BUYER SAYS PAID</span>`
          : `<span style="background:#2b230f;color:#ffb44d;border:1px solid #4a3a1a;font-size:10px;font-weight:700;padding:3px 9px;border-radius:12px;">⏳ PENDING</span>`;
        const statusText = isPaid ? '✅ Paid' : isAwaiting ? '👀 Buyer says paid (unverified)' : '⏳ Pending';
        div.innerHTML = `
          <div class="order-summary-row" onclick="toggleOrderRow('${id}')">
            <div class="order-summary-info">
              <div class="order-summary-name">${o.beatName} ${statusBadge}</div>
              <div class="order-summary-meta">${o.buyerName} · ${date}</div>
            </div>
            <div class="order-summary-right">
              <span class="order-summary-price">₹${o.price}</span>
              <span class="chevron" id="order-chevron-${id}">⌄</span>
            </div>
          </div>
          <div class="order-detail-panel" id="order-panel-${id}" style="display:none">
            <div class="detail-row"><span class="detail-label">Order ID</span><span class="detail-value mono">${o.orderId || id}</span></div>
            <div class="detail-row"><span class="detail-label">Buyer Name</span><span class="detail-value">${o.buyerName}</span></div>
            ${o.buyerStageName ? `<div class="detail-row"><span class="detail-label">Stage Name</span><span class="detail-value">${o.buyerStageName}</span></div>` : ''}
            <div class="detail-row"><span class="detail-label">Phone</span><span class="detail-value">${o.buyerPhone||'-'}</span></div>
            <div class="detail-row"><span class="detail-label">Email</span><span class="detail-value">${o.buyerEmail||'-'}</span></div>
            ${(o.buyerCity || o.buyerState || o.buyerCountry) ? `<div class="detail-row"><span class="detail-label">Location</span><span class="detail-value">${[o.buyerCity,o.buyerState,o.buyerCountry].filter(Boolean).join(', ')||'-'}</span></div>` : ''}
            <div class="detail-row"><span class="detail-label">Amount</span><span class="detail-value">₹${o.price}</span></div>
            <div class="detail-row"><span class="detail-label">Status</span><span class="detail-value">${statusText}</span></div>
            <div class="detail-row"><span class="detail-label">Date</span><span class="detail-value">${date}</span></div>
            ${!isPaid ? `<button onclick="markOrderPaid('${id}')" style="width:100%;margin-top:10px;padding:11px;border-radius:12px;background:linear-gradient(135deg,#ffa63d,#ff8c1a);color:#000;border:none;font-weight:800;font-size:13px;cursor:pointer;">✅ Mark as Paid</button>` : ''}
            ${o.buyerPhone ? `<a class="whatsapp-buyer-btn" href="https://wa.me/91${o.buyerPhone.replace(/\D/g,'').slice(-10)}" target="_blank">💬 WhatsApp Buyer</a>` : ''}
            <button onclick="deleteOrder('${id}')" style="width:100%;margin-top:8px;padding:10px;border-radius:12px;background:#2a1414;color:#ff6b6b;border:1px solid #4a2020;font-weight:700;font-size:12.5px;cursor:pointer;">🗑️ Delete Order</button>
          </div>
        `;
        list.appendChild(div);
      });
      document.getElementById('statOrders').textContent = orders.length;
      const pendingLabel = document.getElementById('statOrdersPending');
      if(pendingCount){
        pendingLabel.textContent = `${pendingCount} pending`;
        pendingLabel.style.display = 'block';
      } else {
        pendingLabel.style.display = 'none';
      }
      document.getElementById('statEarnings').textContent = '₹'+totalEarnings;
    });
  }

  window.markOrderPaid = function(id){
    if(!confirm('Confirm payment received for this order?')) return;
    update(ref(db, 'orders/'+id), { status: 'paid', paidAt: Date.now() });
    // Auto-hide the beat from the store since it's exclusive and now sold
    const order = (window.__allOrders || {})[id];
    if(order && order.beatId){
      update(ref(db, 'beats/'+order.beatId), { isPrivate: true });
    }
  }

  window.toggleBeatPrivate = function(id, makePrivate){
    update(ref(db, 'beats/'+id), { isPrivate: makePrivate });
  }

  window.deleteOrder = function(id){
    if(!confirm('Delete this order permanently? This cannot be undone.')) return;
    remove(ref(db, 'orders/'+id));
  }
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Shri Beatz</title>
<style>
  :root{
    --bg:#0a0a0a;--bg2:#0f0f0f;--card:#161616;--card2:#1b1b1b;--orange:#ff8c1a;--orange-dim:#ffa63d;
    --text:#f2f2f2;--muted:#8f8f8f;--border:#252525;--green:#3ecf8e;--red:#ff5c5c;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at top, #121212 0%, #0a0a0a 60%);
    color:var(--text);
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    padding-bottom:50px;
    min-height:100vh;
  }
  .container{max-width:680px;margin:0 auto;padding:20px 16px;}
  .top-bar{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:28px;padding-bottom:16px;border-bottom:1px solid var(--border);
  }
  .top-bar h1{margin:0;font-size:22px;letter-spacing:0.3px;}
  .top-bar h1 span{color:var(--orange);}
  .top-bar button{
    width:auto;padding:9px 18px;font-size:12px;background:#1c1c1c;color:var(--muted);
    border:1px solid var(--border);border-radius:8px;font-weight:600;
  }
  .top-bar button:hover{color:var(--text);border-color:#444;}

  h2{
    font-size:13px;margin:30px 0 14px;color:var(--muted);
    text-transform:uppercase;letter-spacing:1.2px;font-weight:700;
    display:flex;align-items:center;gap:8px;
  }
  h2::after{content:'';flex:1;height:1px;background:var(--border);}

  .card{
    background:linear-gradient(180deg, var(--card2) 0%, var(--card) 100%);
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px;
    margin-bottom:18px;
    box-shadow:0 4px 18px rgba(0,0,0,0.3);
  }

  .field{margin-bottom:16px;}
  .field label{
    font-size:11px;color:var(--muted);display:block;margin-bottom:7px;
    text-transform:uppercase;letter-spacing:0.6px;font-weight:600;
  }
  .field input{
    width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--border);
    background:#0d0d0d;color:var(--text);font-size:14px;transition:border-color 0.15s;
  }
  .field input:focus{outline:none;border-color:var(--orange);}
  .field input::placeholder{color:#5a5a5a;}

  button{
    background:linear-gradient(135deg, var(--orange-dim), var(--orange));
    color:#0a0a0a;border:none;padding:13px 20px;border-radius:10px;
    font-weight:700;font-size:13px;cursor:pointer;width:100%;
    box-shadow:0 3px 12px rgba(255,140,26,0.25);
    transition:transform 0.1s;
  }
  button:active{transform:scale(0.98);}
  button.secondary{background:#1c1c1c;color:var(--muted);box-shadow:none;border:1px solid var(--border);}

  .order-item{border-bottom:1px solid var(--border);padding:14px 0;font-size:13px;}
  .order-item:last-child{border-bottom:none;}
  .order-item .row{display:flex;justify-content:space-between;margin-bottom:5px;font-size:14px;}
  .order-item .row b{font-weight:700;}
  .order-item .muted{color:var(--muted);font-size:11.5px;line-height:1.6;}

  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
  .stat-card{
    background:linear-gradient(150deg, #181818, #121212);
    border:1px solid var(--border);border-radius:16px;padding:20px 16px;text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
  .stat-card .num{font-size:26px;font-weight:800;color:var(--orange);letter-spacing:0.5px;}
  .stat-card .label{font-size:10.5px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:0.8px;font-weight:600;}

  .beat-row-main{padding:14px 0;border-bottom:1px solid var(--border);}
  .beat-row-main:last-child{border-bottom:none;}
  .beat-row-top{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;margin-bottom:10px;}
  .beat-row-top span:first-child{font-weight:600;}
  .beat-row-actions{display:flex;gap:8px;align-items:center;}
  .beat-row-actions input{
    width:80px;padding:9px 10px;border-radius:8px;border:1px solid var(--border);
    background:#0d0d0d;color:var(--text);font-size:13px;
  }
  .beat-row-actions button{width:auto;padding:9px 16px;font-size:11.5px;box-shadow:none;}
  .edit-btn{background:#16283a !important;color:#5bc0ff !important;border:1px solid #1f3a52;}
  .del-btn{background:#2e1414 !important;color:var(--red) !important;border:1px solid #442020;}

  #loginBox{max-width:360px;margin:100px auto 0;text-align:center;}
  #loginBox h1{font-size:24px;margin-bottom:6px;}
  #loginBox h1 span{color:var(--orange);}
  #loginBox .sub{color:var(--muted);font-size:12.5px;margin-bottom:24px;}
  .msg{font-size:12px;color:var(--muted);margin-top:10px;text-align:center;}
</style>
</head>
<body>

<div class="container">
  <div id="loginBox" class="card">
    <h1>Shri <span>Beatz</span></h1>
    <div class="sub">Admin Dashboard</div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="admin email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="password">
    </div>
    <button onclick="doLogin()">Login</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="adminPanel" style="display:none">
    <div class="top-bar">
      <h1>Admin <span>Panel</span></h1>
      <button class="secondary" onclick="doLogout()">Logout</button>
    </div>

    <h2>📊 Overview</h2>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="num" id="statOrders">0</div>
        <div class="label">Total Orders</div>
      </div>
      <div class="stat-card">
        <div class="num" id="statEarnings">₹0</div>
        <div class="label">Total Earnings</div>
      </div>
      <div class="stat-card">
        <div class="num" id="statBeats">0</div>
        <div class="label">Beats Listed</div>
      </div>
      <div class="stat-card">
        <div class="num" id="statPlays">0</div>
        <div class="label">Total Plays</div>
      </div>
    </div>

    <h2>➕ Add New Beat</h2>
    <div class="card">
      <div class="field">
        <label>Beat Name (as on YouTube)</label>
        <input type="text" id="beatName" placeholder='e.g. "ACHANAK" - Indian Gangsta Type Beat'>
      </div>
      <div class="field">
        <label>Genre / Style</label>
        <input type="text" id="beatGenre" placeholder="Oldschool / 90s Type Beat">
      </div>
      <div class="field">
        <label>Price (₹)</label>
        <input type="number" id="beatPrice" placeholder="50">
      </div>
      <div class="field">
        <label>Preview File Name (mp3, already uploaded to /beats folder on GitHub)</label>
        <input type="text" id="beatFile" placeholder="achanak.mp3">
      </div>
      <button onclick="addBeat()">Add Beat</button>
      <div class="msg" id="addMsg"></div>
    </div>

    <h2>🎵 Manage Beats</h2>
    <div class="card" id="beatsList">
      <div class="msg">Loading...</div>
    </div>

    <h2>📦 Orders</h2>
    <div class="card" id="ordersList">
      <div class="msg">Loading...</div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getDatabase, ref, onValue, push, set, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAZOYSy3s3HwkjhnwQzWPMzabky9LrjX8c",
    authDomain: "shri-beatz-store.firebaseapp.com",
    databaseURL: "https://shri-beatz-store-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "shri-beatz-store",
    storageBucket: "shri-beatz-store.firebasestorage.app",
    messagingSenderId: "1016496280094",
    appId: "1:1016496280094:web:c4398a985f875d0dc7940f"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  window.doLogin = function(){
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    document.getElementById('loginMsg').textContent = 'Logging in...';
    signInWithEmailAndPassword(auth, email, password)
      .catch(err=>{
        document.getElementById('loginMsg').textContent = 'Login failed: ' + err.message;
      });
  }

  window.doLogout = function(){
    signOut(auth);
  }

  onAuthStateChanged(auth, (user)=>{
    if(user){
      document.getElementById('loginBox').style.display='none';
      document.getElementById('adminPanel').style.display='block';
      loadBeats();
      loadOrders();
    } else {
      document.getElementById('loginBox').style.display='block';
      document.getElementById('adminPanel').style.display='none';
    }
  });

  window.addBeat = function(){
    const name = document.getElementById('beatName').value.trim();
    const genre = document.getElementById('beatGenre').value.trim();
    const price = parseInt(document.getElementById('beatPrice').value);
    const file = document.getElementById('beatFile').value.trim();
    if(!name || !price || !file){
      document.getElementById('addMsg').textContent = 'Please fill Name, Price and File Name.';
      return;
    }
    const beatRef = push(ref(db, 'beats'));
    set(beatRef, {
      name, genre, price, file,
      plays: 0,
      createdAt: Date.now()
    }).then(()=>{
      document.getElementById('addMsg').textContent = '✅ Beat added!';
      document.getElementById('beatName').value='';
      document.getElementById('beatGenre').value='';
      document.getElementById('beatPrice').value='';
      document.getElementById('beatFile').value='';
    });
  }

  function loadBeats(){
    onValue(ref(db, 'beats'), (snapshot)=>{
      const data = snapshot.val();
      const list = document.getElementById('beatsList');
      list.innerHTML='';
      if(!data){
        list.innerHTML = '<div class="msg">No beats yet.</div>';
        document.getElementById('statBeats').textContent = '0';
        document.getElementById('statPlays').textContent = '0';
        return;
      }
      let totalPlays = 0;
      Object.entries(data).forEach(([id, beat])=>{
        totalPlays += (beat.plays||0);
        const row = document.createElement('div');
        row.className='beat-row-main';
        row.innerHTML = `
          <div class="beat-row-top">
            <span>${beat.name}</span>
            <span class="muted">🎧${beat.plays||0}</span>
          </div>
          <div class="beat-row-actions">
            <span class="muted">₹</span>
            <input type="number" id="price-${id}" value="${beat.price}">
            <button class="edit-btn" onclick="updatePrice('${id}')">Update</button>
            <button class="del-btn" onclick="deleteBeat('${id}')">Delete</button>
          </div>
        `;
        list.appendChild(row);
      });
      document.getElementById('statBeats').textContent = Object.keys(data).length;
      document.getElementById('statPlays').textContent = totalPlays;
    });
  }

  window.updatePrice = function(id){
    const newPrice = parseInt(document.getElementById('price-'+id).value);
    if(!newPrice || newPrice <= 0){ alert('Enter a valid price'); return; }
    set(ref(db, 'beats/'+id+'/price'), newPrice).then(()=>{
      alert('Price updated!');
    });
  }

  window.deleteBeat = function(id){
    if(confirm('Delete this beat?')){
      remove(ref(db, 'beats/'+id));
    }
  }

  function loadOrders(){
    onValue(ref(db, 'orders'), (snapshot)=>{
      const data = snapshot.val();
      const list = document.getElementById('ordersList');
      list.innerHTML='';
      if(!data){
        list.innerHTML = '<div class="msg">No orders yet.</div>';
        document.getElementById('statOrders').textContent = '0';
        document.getElementById('statEarnings').textContent = '₹0';
        return;
      }
      const orders = Object.entries(data).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
      let totalEarnings = 0;
      orders.forEach(([id, o])=>{
        totalEarnings += (o.price||0);
        const div = document.createElement('div');
        div.className='order-item';
        const date = new Date(o.createdAt).toLocaleString('en-IN');
        div.innerHTML = `
          <div class="row"><b>${o.beatName}</b><span>₹${o.price}</span></div>
          <div class="muted">${o.buyerName} | ${o.buyerPhone} | ${o.buyerEmail||'-'}</div>
          <div class="muted">Payment ID: ${o.paymentId} | ${date}</div>
        `;
        list.appendChild(div);
      });
      document.getElementById('statOrders').textContent = orders.length;
      document.getElementById('statEarnings').textContent = '₹'+totalEarnings;
    });
  }
</script>
</body>
</html>

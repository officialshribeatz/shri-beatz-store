<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shri Beatz Store</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<style>
  :root{
    --bg:#0a0a0a;
    --card:#161616;
    --orange:#ff8c1a;
    --text:#f2f2f2;
    --muted:#9a9a9a;
    --border:#2a2a2a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    padding-bottom:60px;
  }
  header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:18px 16px;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    background:rgba(10,10,10,0.95);
    backdrop-filter:blur(6px);
    z-index:10;
  }
  header img{width:44px;height:44px;border-radius:8px;}
  header h1{font-size:20px;color:var(--orange);letter-spacing:0.5px;}
  header p{font-size:11px;color:var(--muted);}
  .container{max-width:640px;margin:0 auto;padding:16px;}
  .beat-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    margin-bottom:16px;
  }
  .beat-title{
    font-size:16px;
    font-weight:600;
    margin-bottom:4px;
  }
  .beat-meta{
    font-size:12px;
    color:var(--muted);
    margin-bottom:12px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
  }
  audio{
    width:100%;
    margin-bottom:12px;
    height:36px;
  }
  .beat-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .price{
    font-size:18px;
    font-weight:700;
    color:var(--orange);
  }
  .buy-btn{
    background:var(--orange);
    color:#000;
    border:none;
    padding:10px 22px;
    border-radius:30px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .buy-btn:active{transform:scale(0.97);}
  .empty{
    text-align:center;
    color:var(--muted);
    padding:60px 20px;
    font-size:14px;
  }
  /* Modal */
  .overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.75);
    z-index:100;
    align-items:flex-end;
    justify-content:center;
  }
  .overlay.active{display:flex;}
  .modal{
    background:var(--card);
    width:100%;
    max-width:480px;
    border-radius:18px 18px 0 0;
    padding:24px 20px 30px;
    animation:slideUp 0.25s ease;
  }
  @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .modal h3{margin-bottom:14px;font-size:17px;}
  .modal-beat{color:var(--orange);font-weight:600;}
  .field{margin-bottom:14px;}
  .field label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;}
  .field input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#0f0f0f;
    color:var(--text);
    font-size:14px;
  }
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions button{
    flex:1;
    padding:12px;
    border-radius:30px;
    border:none;
    font-weight:700;
    cursor:pointer;
  }
  .cancel-btn{background:#222;color:var(--text);}
  .pay-btn{background:var(--orange);color:#000;}
  .success-box{
    text-align:center;
    padding:10px 0;
  }
  .success-box .tick{font-size:44px;margin-bottom:10px;}
  .success-box p{color:var(--muted);font-size:13px;margin-top:10px;line-height:1.5;}
  footer{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    padding:20px;
  }
</style>
</head>
<body>

<header>
  <img src="logo.png" alt="logo" onerror="this.style.display='none'">
  <div>
    <h1>SHRI BEATZ</h1>
    <p>Exclusive Beats Store</p>
  </div>
</header>

<div class="container" id="beatsContainer">
  <div class="empty">Loading beats...</div>
</div>

<footer>© Shri Beatz. All beats sold are exclusive.</footer>

<!-- Buy Modal -->
<div class="overlay" id="buyOverlay">
  <div class="modal">
    <div id="formStep">
      <h3>Buy <span class="modal-beat" id="modalBeatName"></span></h3>
      <div class="field">
        <label>Your Name</label>
        <input type="text" id="buyerName" placeholder="Full name">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="buyerEmail" placeholder="you@example.com">
      </div>
      <div class="field">
        <label>WhatsApp Number</label>
        <input type="tel" id="buyerPhone" placeholder="10-digit number">
      </div>
      <div class="modal-actions">
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
        <button class="pay-btn" onclick="proceedToPay()">Pay ₹<span id="modalPrice"></span></button>
      </div>
    </div>
    <div id="successStep" style="display:none">
      <div class="success-box">
        <div class="tick">✅</div>
        <h3>Payment Successful!</h3>
        <p>Thank you for your purchase. Your exclusive beat file (WAV + Trackout) will be sent to your WhatsApp / Email within 24 hours.</p>
        <div class="modal-actions">
          <button class="pay-btn" style="flex:1" onclick="closeModal()">Done</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, push, set, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAZOYSy3s3HwkjhnwQzWPMzabky9LrjX8c",
    authDomain: "shri-beatz-store.firebaseapp.com",
    databaseURL: "https://shri-beatz-store-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "shri-beatz-store",
    storageBucket: "shri-beatz-store.firebasestorage.app",
    messagingSenderId: "1016496280094",
    appId: "1:1016496280094:web:c4398a985f875d0dc7940f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const RAZORPAY_KEY_ID = "rzp_live_TOY0k1PnoWeL26";

  let currentBeat = null;
  const container = document.getElementById('beatsContainer');

  const beatsRef = ref(db, 'beats');
  let renderedIds = new Set();

  onValue(beatsRef, (snapshot) => {
    const data = snapshot.val();
    if(!data){
      container.innerHTML = '<div class="empty">No beats available right now. Check back soon!</div>';
      renderedIds = new Set();
      return;
    }
    const beats = Object.entries(data).sort((a,b)=> (b[1].createdAt||0)-(a[1].createdAt||0));
    const currentIds = new Set(beats.map(b=>b[0]));

    // If the set of beats changed (added/removed), do a full rebuild
    const idsChanged = currentIds.size !== renderedIds.size || [...currentIds].some(id=>!renderedIds.has(id));

    if(idsChanged){
      container.innerHTML = '';
      beats.forEach(([id, beat])=>{
        const card = document.createElement('div');
        card.className = 'beat-card';
        card.dataset.beatId = id;
        card.innerHTML = `
          <div class="beat-title">${beat.name}</div>
          <div class="beat-meta">
            <span class="play-count">🎧 ${beat.plays||0} plays</span>
            <span>${beat.genre||''}</span>
          </div>
          <audio controls preload="none" src="beats/${beat.file}"></audio>
          <div class="beat-footer">
            <div class="price">₹${beat.price}</div>
            <button class="buy-btn" onclick='openModal("${id}", ${JSON.stringify(beat.name)}, ${beat.price})'>Buy Now</button>
          </div>
        `;
        const audioEl = card.querySelector('audio');
        let counted = false;
        let playTimer = null;
        audioEl.addEventListener('play', ()=>{
          if(!counted){
            playTimer = setTimeout(()=>{
              if(!counted){
                counted = true;
                const plaRef = ref(db, 'beats/'+id+'/plays');
                runTransaction(plaRef, (val)=> (val||0)+1);
              }
            }, 10000);
          }
        });
        audioEl.addEventListener('pause', ()=>{
          if(playTimer){ clearTimeout(playTimer); playTimer=null; }
        });
        container.appendChild(card);
      });
      renderedIds = currentIds;
    } else {
      // Only update play counts in place, don't touch audio elements
      beats.forEach(([id, beat])=>{
        const card = container.querySelector(`[data-beat-id="${id}"]`);
        if(card){
          const countEl = card.querySelector('.play-count');
          if(countEl) countEl.textContent = `🎧 ${beat.plays||0} plays`;
        }
      });
    }
  });

  window.openModal = function(id, name, price){
    currentBeat = {id, name, price};
    document.getElementById('modalBeatName').textContent = name;
    document.getElementById('modalPrice').textContent = price;
    document.getElementById('formStep').style.display='block';
    document.getElementById('successStep').style.display='none';
    document.getElementById('buyOverlay').classList.add('active');
  }
  window.closeModal = function(){
    document.getElementById('buyOverlay').classList.remove('active');
    document.getElementById('buyerName').value='';
    document.getElementById('buyerEmail').value='';
    document.getElementById('buyerPhone').value='';
  }

  window.proceedToPay = function(){
    const name = document.getElementById('buyerName').value.trim();
    const email = document.getElementById('buyerEmail').value.trim();
    const phone = document.getElementById('buyerPhone').value.trim();
    if(!name || !phone){
      alert('Please enter your name and WhatsApp number.');
      return;
    }
    const options = {
      key: RAZORPAY_KEY_ID,
      amount: currentBeat.price * 100,
      currency: "INR",
      name: "Shri Beatz",
      description: currentBeat.name,
      prefill: { name: name, email: email, contact: phone },
      handler: function(response){
        const orderRef = push(ref(db, 'orders'));
        set(orderRef, {
          beatId: currentBeat.id,
          beatName: currentBeat.name,
          price: currentBeat.price,
          buyerName: name,
          buyerEmail: email,
          buyerPhone: phone,
          paymentId: response.razorpay_payment_id,
          status: "paid",
          createdAt: Date.now()
        });
        document.getElementById('formStep').style.display='none';
        document.getElementById('successStep').style.display='block';
      },
      theme: { color: "#ff8c1a" }
    };
    const rzp = new Razorpay(options);
    rzp.open();
  }
</script>
</body>
</html>
